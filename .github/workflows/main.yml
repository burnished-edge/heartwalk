name: Update Heart Walk Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:        # Manual 1-click run from GitHub UI
  repository_dispatch:      # Allows triggering via simple curl/webhook without logging into GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and compile Heart Walk data
        run: |
          python - << 'EOF'
          import requests, json, time

          API_KEY = "wDB09SQODRpVIOvX"
          FR_ID = "13179"
          BASE_URL = "https://www2.heart.org/site/CRTeamraiserAPI"

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})

          def fetch_all_records(method, extra_params, key_name, root_name):
              records = []
              offset = 0
              page_size = 500
              total_count = None

              while True:
                  params = {
                      "method": method,
                      "api_key": API_KEY,
                      "v": "1.0",
                      "response_format": "json",
                      "fr_id": FR_ID,
                      "list_page_size": str(page_size),
                      "list_page_offset": str(offset),
                      **extra_params
                  }
                  
                  print(f"[{method}] Requesting offset={offset}, size={page_size}...")
                  res = session.get(BASE_URL, params=params, timeout=30)
                  res.raise_for_status()
                  data = res.json().get(root_name, {})

                  if total_count is None:
                      total_count = int(data.get("totalNumberResults", 0))
                      print(f"[{method}] Server reports total items: {total_count}")

                  items = data.get(key_name, [])
                  if isinstance(items, dict):
                      items = [items]

                  if not items:
                      print(f"[{method}] No items returned at offset {offset}. Done.")
                      break

                  records.extend(items)
                  print(f"[{method}] Collected {len(records)} of {total_count}...")

                  offset += len(items)
                  if offset >= total_count or len(items) < page_size:
                      break
                  
                  time.sleep(0.15)

              return records

          print("--- Fetching Walkers ---")
          # Use both first and last name wildcard fallbacks if needed
          walkers = fetch_all_records("getParticipants", {"first_name": "%%%"}, "participant", "getParticipantsResponse")
          if len(walkers) < 1000:
              # Fallback to last_name wildcard if first_name was throttled by Convio
              walkers_alt = fetch_all_records("getParticipants", {"last_name": "%%%"}, "participant", "getParticipantsResponse")
              # Deduplicate by consId
              walker_map = {w.get("consId"): w for w in walkers + walkers_alt if w.get("consId")}
              walkers = list(walker_map.values())

          print(f"Total Walkers Retrieved: {len(walkers)}")

          print("--- Fetching Teams ---")
          teams = fetch_all_records("getTeamsByInfo", {"team_name": "%%%"}, "team", "getTeamSearchByInfoResponse")
          print(f"Total Teams Retrieved: {len(teams)}")

          print("--- Fetching Companies ---")
          companies = fetch_all_records("getCompaniesByInfo", {"company_name": "%%%"}, "company", "getCompaniesResponse")
          print(f"Total Companies Retrieved: {len(companies)}")

          dataset = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "walkers": walkers,
              "teams": teams,
              "companies": companies
          }

          with open("heartwalk_data.json", "w", encoding="utf-8") as f:
              json.dump(dataset, f, indent=2)
          print("Saved heartwalk_data.json successfully.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add heartwalk_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Heart Walk data [$(date -u +'%Y-%m-%d %H:%M')]" && git push)
