name: Update Heart Walk Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and compile Heart Walk data
        run: |
          python - << 'EOF'
          import requests
          import json
          import time

          API_KEY = "wDB09SQODRpVIOvX"
          FR_ID = "13179"
          BASE_URL = "https://www2.heart.org/site/CRTeamraiserAPI"

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})

          def fetch_paginated(method, extra_params, key_name, root_name):
              records = []
              page_idx = 0
              page_size = 500

              while True:
                  params = {
                      "method": method,
                      "api_key": API_KEY,
                      "v": "1.0",
                      "response_format": "json",
                      "fr_id": FR_ID,
                      "list_page_size": str(page_size),
                      "list_page_offset": str(page_idx),
                      **extra_params
                  }

                  try:
                      res = session.get(BASE_URL, params=params, timeout=30)
                      res.raise_for_status()
                      data = res.json().get(root_name, {})
                  except Exception as e:
                      print(f"[{method}] Error on page {page_idx}: {e}")
                      break

                  items = data.get(key_name, [])
                  if isinstance(items, dict):
                      items = [items]

                  if not items:
                      break

                  records.extend(items)
                  total = int(data.get("totalNumberResults", len(records)))

                  page_idx += 1
                  if len(records) >= total or len(items) < page_size:
                      break

                  time.sleep(0.15)

              return records

          print("--- 1. Fetching Teams ---")
          teams = fetch_paginated("getTeamsByInfo", {"team_name": "%%%"}, "team", "getTeamSearchByInfoResponse")
          print(f"Total Teams: {len(teams)}")

          print("--- 2. Fetching Companies ---")
          companies = fetch_paginated("getCompaniesByInfo", {"company_name": "%%%"}, "company", "getCompaniesResponse")
          print(f"Total Companies: {len(companies)}")

          walker_dict = {}

          print("--- 3. Fetching Walkers (First-Name Wildcard) ---")
          primary_fn = fetch_paginated("getParticipants", {"first_name": "%%%"}, "participant", "getParticipantsResponse")
          for w in primary_fn:
              cid = w.get("consId")
              if cid:
                  walker_dict[cid] = w
          print(f"Walkers after first_name query: {len(walker_dict)}")

          print("--- 4. Fetching Walkers (Last-Name Wildcard Sweep) ---")
          primary_ln = fetch_paginated("getParticipants", {"last_name": "%%%"}, "participant", "getParticipantsResponse")
          new_ln = 0
          for w in primary_ln:
              cid = w.get("consId")
              if cid and cid not in walker_dict:
                  walker_dict[cid] = w
                  new_ln += 1
          print(f"Added {new_ln} unaffiliated walkers caught via last_name query.")

          print("--- 5. Checking Team Rosters for Unlisted Members ---")
          for idx, team in enumerate(teams):
              team_id = team.get("id")
              if not team_id:
                  continue

              team_members = fetch_paginated(
                  "getTeamParticipants",
                  {"team_id": str(team_id)},
                  "participant",
                  "getTeamParticipantsResponse"
              )

              added = 0
              for m in team_members:
                  cid = m.get("consId")
                  if cid and cid not in walker_dict:
                      if "teamName" not in m:
                          m["teamName"] = team.get("name", "—")
                      if "teamId" not in m:
                          m["teamId"] = team_id
                      if "companyName" not in m and team.get("companyName"):
                          m["companyName"] = team.get("companyName")
                      walker_dict[cid] = m
                      added += 1

          print(f"\nFinal Consolidated Walker Count: {len(walker_dict)}")

          dataset = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "walkers": list(walker_dict.values()),
              "teams": teams,
              "companies": companies
          }

          with open("heartwalk_data.json", "w", encoding="utf-8") as f:
              json.dump(dataset, f, indent=2)

          print("heartwalk_data.json updated successfully.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add heartwalk_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Heart Walk data [$(date -u +'%Y-%m-%d %H:%M')]" && git push)
