<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Walk Event Data Extractor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --console-bg: #020617;
      --console-text: #38bdf8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .widget-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 1.35rem;
    }
    p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #console {
      background: var(--console-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--console-text);
      height: 200px;
      overflow-y: auto;
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="widget-card">
  <h2>❤️ Heart Walk Data Extractor</h2>
  <p>Paginates through all companies, teams, and walkers for Event #13179 and exports a single structured JSON file.</p>

  <div class="grid">
    <div class="stat-box">
      <div class="stat-label">Companies</div>
      <div class="stat-val" id="comp-count">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Teams</div>
      <div class="stat-val" id="team-count">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Walkers</div>
      <div class="stat-val" id="walk-count">0</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <button id="start-btn" onclick="startExtraction()">Start Extraction &amp; Download JSON</button>

  <div id="console">Ready to begin...</div>
</div>

<script>
  const BASE_URL = "https://www2.heart.org/site/CRTeamraiserAPI";
  const API_KEY = "wDB09SQODRpVIOvX";
  const FR_ID = "13179";
  const PAGE_SIZE = 500;

  const logBox = document.getElementById("console");
  const btn = document.getElementById("start-btn");
  const progressBar = document.getElementById("progress");

  function log(msg) {
    logBox.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  function toArray(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data;
    return [data];
  }

  // Native JSONP implementation (No proxy needed, no CORS issues)
  function requestJSONP(method, extraParams = {}) {
    return new Promise((resolve, reject) => {
      const callbackName = "jsonp_cb_" + Math.random().toString(36).substring(2, 9);
      const params = new URLSearchParams({
        method,
        fr_id: FR_ID,
        v: "1.0",
        response_format: "json",
        api_key: API_KEY,
        callback: callbackName,
        ...extraParams
      });

      const script = document.createElement("script");
      script.src = `${BASE_URL}?${params.toString()}`;

      window[callbackName] = function (data) {
        delete window[callbackName];
        script.remove();
        resolve(data);
      };

      script.onerror = function () {
        delete window[callbackName];
        script.remove();
        reject(new Error(`JSONP request failed for ${method}`));
      };

      document.body.appendChild(script);
    });
  }

  async function fetchPaged(method, rootKey, itemKey, filterKey) {
    let records = [];
    let offset = 0;
    let total = Infinity;

    while (offset < total) {
      const res = await requestJSONP(method, {
        [filterKey]: "%",
        list_page_size: PAGE_SIZE,
        list_page_offset: offset
      });

      const root = res[rootKey] || {};
      const items = toArray(root[itemKey]);

      if (!items.length) break;

      records.push(...items);
      total = parseInt(root.totalNumberResults || 0, 10);
      offset += PAGE_SIZE;

      log(`  Fetched ${records.length} / ${isNaN(total) ? '?' : total} records...`);
      await new Promise(r => setTimeout(r, 200));
    }

    return records;
  }

  async function startExtraction() {
    btn.disabled = true;
    logBox.textContent = "Starting extraction sequence...";
    progressBar.style.width = "5%";

    const masterOutput = {
      meta: {
        event_id: FR_ID,
        extracted_at: new Date().toISOString()
      },
      campaign: {},
      companies: [],
      teams: [],
      walkers: []
    };

    try {
      // 1. Campaign Details
      log("1/4: Fetching campaign data...");
      try {
        const camp = await requestJSONP("getTeamraiserData");
        masterOutput.campaign = camp.getTeamraiserDataResponse?.teamraiserData || {};
      } catch {
        log("  Notice: Campaign summary skipped.");
      }
      progressBar.style.width = "20%";

      // 2. Companies
      log("2/4: Extracting companies...");
      try {
        const compRecords = await fetchPaged("getCompaniesByInfo", "getCompaniesResponse", "company", "company_name");
        masterOutput.companies = compRecords;
      } catch {
        log("  getCompaniesByInfo limited, falling back to top companies...");
        const topComp = await requestJSONP("getTopCompaniesData");
        masterOutput.companies = toArray(topComp.getTopCompaniesDataResponse?.company);
      }
      document.getElementById("comp-count").textContent = masterOutput.companies.length;
      progressBar.style.width = "40%";

      // 3. Teams
      log("3/4: Extracting teams...");
      const teamRecords = await fetchPaged("getTeamsByInfo", "getTeamsResponse", "team", "team_name");
      masterOutput.teams = teamRecords.map(t => ({
        team_id: t.id,
        team_name: t.name,
        company_id: t.companyId || null,
        company_name: t.companyName || null,
        captain_name: `${t.captainFirstName || ''} ${t.captainLastName || ''}`.trim(),
        num_members: t.numMembers,
        amount_raised_usd: (parseFloat(t.amountRaised || 0) / 100).toFixed(2),
        goal_usd: (parseFloat(t.goal || 0) / 100).toFixed(2)
      }));
      document.getElementById("team-count").textContent = masterOutput.teams.length;
      progressBar.style.width = "65%";

      // 4. Walkers / Participants
      log("4/4: Extracting walkers...");
      const walkerRecords = await fetchPaged("getParticipants", "getParticipantsResponse", "participant", "first_name");
      masterOutput.walkers = walkerRecords.map(w => {
        const first = w.name?.first || w.firstName || "";
        const last = w.name?.last || w.lastName || "";
        return {
          cons_id: w.consId,
          full_name: `${first} ${last}`.trim(),
          team_id: w.teamId || null,
          team_name: w.teamName || null,
          company_id: w.companyId || null,
          amount_raised_usd: (parseFloat(w.amountRaised || 0) / 100).toFixed(2),
          goal_usd: (parseFloat(w.goal || 0) / 100).toFixed(2)
        };
      });
      document.getElementById("walk-count").textContent = masterOutput.walkers.length;
      progressBar.style.width = "100%";

      // Download JSON
      log("Generating download...");
      const blob = new Blob([JSON.stringify(masterOutput, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `heart_walk_${FR_ID}_complete.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      log(`Extraction complete! Saved ${masterOutput.walkers.length} walkers, ${masterOutput.teams.length} teams, and ${masterOutput.companies.length} companies.`);
    } catch (err) {
      log(`Error encountered: ${err.message}`);
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
