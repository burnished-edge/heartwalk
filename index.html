<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Walk Leaderboard & Data Explorer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #ef4444;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 24px; font-weight: 700; color: #fff; }
    .timestamp { font-size: 13px; color: var(--muted); }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--red); border-color: var(--red); color: white; }
    
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-box {
      flex: 1;
      min-width: 260px;
      padding: 9px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }
    
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th {
      background: #182234;
      padding: 12px 16px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: white; }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .amount { font-weight: 600; color: #4ade80; font-family: monospace; font-size: 15px; }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 4px;
      background: #334155;
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>AHA Heart Walk Data Explorer</h1>
      <div id="statusText" class="timestamp">Loading data...</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('walkers')">Walkers (<span id="countWalkers">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('teams')">Teams (<span id="countTeams">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('companies')">Companies (<span id="countCompanies">0</span>)</button>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-box" placeholder="Search by name, team, company..." oninput="handleSearch()">
  </div>

  <div class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let rawData = { walkers: [], teams: [], companies: [] };
  let currentTab = 'walkers';
  let sortColumn = 'amount';
  let sortAscending = false;

  async function loadData() {
    try {
      const res = await fetch('./heartwalk_data.json');
      if (!res.ok) throw new Error("Could not find heartwalk_data.json. Run the workflow/script first.");
      const json = await res.json();
      
      rawData.walkers = (json.walkers || []).map(w => ({
        name: `${w.name?.first || ''} ${w.name?.last || ''}`.trim(),
        team: w.teamName || '—',
        amount: parseFloat(w.amountRaised || 0) / 100,
        goal: parseFloat(w.goal || 0) / 100,
        id: w.consId
      }));

      rawData.teams = (json.teams || []).map(t => ({
        name: t.name || '—',
        captain: `${t.captainFirstName || ''} ${t.captainLastName || ''}`.trim(),
        company: t.companyName || '—',
        members: parseInt(t.numMembers || 0, 10),
        amount: parseFloat(t.amountRaised || 0) / 100,
        goal: parseFloat(t.goal || 0) / 100
      }));

      rawData.companies = (json.companies || []).map(c => ({
        name: c.companyName || '—',
        amount: parseFloat(c.amountRaised || 0) / 100,
        teamCount: parseInt(c.teamCount || 0, 10),
        walkerCount: parseInt(c.participantCount || 0, 10)
      }));

      document.getElementById('countWalkers').innerText = rawData.walkers.length;
      document.getElementById('countTeams').innerText = rawData.teams.length;
      document.getElementById('countCompanies').innerText = rawData.companies.length;
      document.getElementById('statusText').innerText = `Last updated: ${json.updated_at || 'Recently'}`;

      render();
    } catch (err) {
      document.getElementById('statusText').innerHTML = `<span style="color:#ef4444">${err.message}</span>`;
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    sortColumn = 'amount';
    sortAscending = false;
    render();
  }

  function setSort(col) {
    if (sortColumn === col) {
      sortAscending = !sortAscending;
    } else {
      sortColumn = col;
      sortAscending = false;
    }
    render();
  }

  function handleSearch() {
    render();
  }

  function render() {
    const filter = (document.getElementById('searchInput').value || '').toLowerCase();
    let records = [...rawData[currentTab]];

    if (filter) {
      records = records.filter(r => Object.values(r).some(val => String(val).toLowerCase().includes(filter)));
    }

    records.sort((a, b) => {
      let valA = a[sortColumn];
      let valB = b[sortColumn];
      if (typeof valA === 'string') {
        return sortAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
      }
      return sortAscending ? valA - valB : valB - valA;
    });

    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    if (currentTab === 'walkers') {
      thead.innerHTML = `
        <tr>
          <th onclick="setSort('name')">Name</th>
          <th onclick="setSort('team')">Team</th>
          <th onclick="setSort('amount')">Raised</th>
          <th onclick="setSort('goal')">Goal</th>
        </tr>`;
      tbody.innerHTML = records.map(r => `
        <tr>
          <td><strong>${r.name}</strong></td>
          <td>${r.team}</td>
          <td class="amount">$${r.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
          <td>$${r.goal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
        </tr>`).join('');
    } else if (currentTab === 'teams') {
      thead.innerHTML = `
        <tr>
          <th onclick="setSort('name')">Team Name</th>
          <th onclick="setSort('captain')">Captain</th>
          <th onclick="setSort('company')">Company</th>
          <th onclick="setSort('members')">Members</th>
          <th onclick="setSort('amount')">Raised</th>
        </tr>`;
      tbody.innerHTML = records.map(r => `
        <tr>
          <td><strong>${r.name}</strong></td>
          <td>${r.captain}</td>
          <td>${r.company}</td>
          <td>${r.members}</td>
          <td class="amount">$${r.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
        </tr>`).join('');
    } else if (currentTab === 'companies') {
      thead.innerHTML = `
        <tr>
          <th onclick="setSort('name')">Company Name</th>
          <th onclick="setSort('teamCount')">Teams</th>
          <th onclick="setSort('walkerCount')">Walkers</th>
          <th onclick="setSort('amount')">Total Raised</th>
        </tr>`;
      tbody.innerHTML = records.map(r => `
        <tr>
          <td><strong>${r.name}</strong></td>
          <td>${r.teamCount}</td>
          <td>${r.walkerCount}</td>
          <td class="amount">$${r.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
        </tr>`).join('');
    }
  }

  loadData();
</script>
</body>
</html>
